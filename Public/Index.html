<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Got Diesel provides mobile diesel fuel delivery for equipment, fleets, generators, and customer-owned storage tanks."
  >

  <meta name="theme-color" content="#090909">

  <title>Got Diesel | Mobile Diesel Fuel Delivery</title>

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="/got-diesel-logo-icon.png"
  >

  <!-- Social sharing -->
  <meta
    property="og:title"
    content="Got Diesel | Mobile Diesel Fuel Delivery"
  >

  <meta
    property="og:description"
    content="Diesel delivered where you need it."
  >

  <meta
    property="og:image"
    content="/got-diesel-logo-primary.png"
  >

  <style>
    :root {
      --black: #090909;
      --black-light: #111214;
      --panel: #17191d;
      --panel-light: #1e2126;

      --silver: #c9ced3;
      --white: #f5f6f7;
      --muted: #a6adb4;

      --red: #bd1f27;
      --red-bright: #e43842;

      --border: #2b3036;

      --max-width: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: var(--white);

      background:
        radial-gradient(
          circle at 85% 10%,
          rgba(196, 31, 41, 0.18),
          transparent 32%
        ),
        linear-gradient(
          180deg,
          var(--black),
          var(--black-light)
        );

      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .container {
      width: min(calc(100% - 40px), var(--max-width));
      margin: 0 auto;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(9, 9, 9, 0.94);

      border-bottom: 1px solid var(--border);

      backdrop-filter: blur(12px);
    }

    .navbar {
      min-height: 82px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 24px;
    }

    .logo img {
      width: 250px;
      height: auto;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    nav a {
      color: #d8dadd;
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* BUTTONS */

    .button {
      min-height: 48px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 0 20px;

      border-radius: 10px;

      font-weight: 800;

      color: white;

      background:
        linear-gradient(
          180deg,
          var(--red-bright),
          var(--red)
        );

      border: 1px solid var(--red-bright);

      box-shadow:
        0 10px 28px
        rgba(196, 31, 41, 0.25);
    }

    .button-secondary {
      background:
        linear-gradient(
          180deg,
          #272a2f,
          #17191c
        );

      border-color: #474d54;

      box-shadow: none;
    }

    /* HERO */

    .hero {
      padding: 95px 0 75px;

      border-bottom: 1px solid var(--border);

      background:
        radial-gradient(
          circle at 82% 30%,
          rgba(196, 31, 41, 0.20),
          transparent 35%
        );
    }

    .hero-grid {
      display: grid;

      grid-template-columns:
        1.1fr 0.9fr;

      gap: 50px;

      align-items: center;
    }

    .eyebrow {
      margin-bottom: 14px;

      color: var(--red-bright);

      font-size: 0.82rem;

      font-weight: 900;

      letter-spacing: 0.15em;

      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      max-width: 800px;

      font-size:
        clamp(
          3rem,
          7vw,
          6rem
        );

      line-height: 0.93;

      letter-spacing: -0.055em;
    }

    .hero-text {
      max-width: 720px;

      margin-top: 24px;

      color: var(--muted);

      font-size:
        clamp(
          1.05rem,
          2vw,
          1.3rem
        );
    }

    .hero-buttons {
      margin-top: 30px;

      display: flex;

      flex-wrap: wrap;

      gap: 12px;
    }

    .logo-card {
      padding: 28px;

      border-radius: 20px;

      border: 1px solid var(--border);

      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.055),
          rgba(255, 255, 255, 0.015)
        );

      box-shadow:
        0 20px 55px
        rgba(0, 0, 0, 0.38);
    }

    .logo-card img {
      width: 100%;

      filter:
        drop-shadow(
          0 16px 30px
          rgba(0, 0, 0, 0.40)
        );
    }

    /* TRUST BOXES */

    .trust-grid {
      margin-top: 55px;

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 14px;
    }

    .trust-item {
      padding: 20px;

      border-radius: 14px;

      border: 1px solid var(--border);

      background:
        rgba(
          255,
          255,
          255,
          0.025
        );
    }

    .trust-item strong {
      display: block;

      margin-bottom: 5px;

      color: var(--white);
    }

    .trust-item span {
      color: var(--muted);

      font-size: 0.9rem;
    }

    /* GENERAL SECTIONS */

    section {
      padding: 78px 0;
    }

    .section-heading {
      max-width: 820px;

      margin-bottom: 32px;
    }

    h2 {
      margin:
        8px
        0
        12px;

      font-size:
        clamp(
          2rem,
          4vw,
          3.3rem
        );

      line-height: 1.03;

      letter-spacing: -0.035em;
    }

    .section-heading p {
      margin: 0;

      color: var(--muted);

      font-size: 1.05rem;
    }

    /* SERVICES */

    .service-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 16px;
    }

    .card {
      padding: 28px;

      border-radius: 16px;

      border: 1px solid var(--border);

      background:
        linear-gradient(
          180deg,
          var(--panel-light),
          var(--panel)
        );
    }

    .card h3 {
      margin:
        0
        0
        8px;

      font-size: 1.25rem;
    }

    .card p {
      margin: 0;

      color: var(--muted);
    }

    /* PROCESS */

    .process-section {
      border-top: 1px solid var(--border);

      border-bottom: 1px solid var(--border);

      background:
        linear-gradient(
          180deg,
          #1a1c20,
          #121417
        );
    }

    .steps {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 16px;
    }
